<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:PlexAr;src:url(plexar400.ttf);font-weight:400}
@font-face{font-family:PlexAr;src:url(plexar600.ttf);font-weight:600}
@font-face{font-family:PlexAr;src:url(plexar700.ttf);font-weight:700}
@font-face{font-family:Sora;src:url(sora600.ttf);font-weight:600}
*{box-sizing:border-box;margin:0}html{width:1080px;height:1350px;overflow:hidden}
body{width:1080px;height:1350px;background:#0F172A;color:#fff;font-family:PlexAr,Sora,sans-serif;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:70px 72px 64px}
.rings{position:absolute;right:auto;left:0;bottom:0;width:640px;height:640px;transform:translate(-40%,35%)}
.top{display:flex;justify-content:space-between;align-items:center;position:relative}
.top img{height:70px}
.tag{border:2px solid #22D3EE;color:#22D3EE;border-radius:40px;padding:6px 22px;font-size:24px;font-weight:600}
h1{font-size:84px;font-weight:700;line-height:1.2;margin-top:44px;position:relative}
h1 span{color:#22D3EE}
.sub{font-size:31px;color:#A5B4CF;margin-top:16px;line-height:1.6;position:relative}
.prod{flex:1;min-height:0;display:grid;place-items:center;position:relative;margin:18px 0}
.prod .card{background:#fff;border-radius:32px;padding:18px;width:470px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.prod img{width:100%;display:block}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;position:relative}
.step{background:#13224A;border:1.5px solid rgba(37,99,235,.6);border-radius:24px;padding:20px 22px;text-align:center}
.step b{display:block;font-family:Sora;font-size:40px;color:#22D3EE}
.step span{font-size:28px;font-weight:600}
</style></head><body>
<svg class="rings" viewBox="0 0 200 200"><circle cx="100" cy="100" r="95" fill="none" stroke="#2563EB" stroke-width=".5" opacity=".35"/><circle cx="100" cy="100" r="70" fill="none" stroke="#2563EB" stroke-width=".5" opacity=".55"/><circle cx="100" cy="100" r="45" fill="none" stroke="#22D3EE" stroke-width=".5" opacity=".7"/></svg>
<div class="top"><img src="logo-white.svg"><div class="tag">🇯🇴 صُنع لمحلات الأردن</div></div>
<h1>زبونك مبسوط؟<br><span>خليه يقيّمك بنقرة.</span></h1>
<p class="sub">ستاند Google الذكي على الكاشير: الزبون بيقرّب تلفونه، وصفحة تقييمك بتفتح فوراً.</p>
<div class="prod"><div class="card"><img src="p_small.jpg"></div></div>
<div class="steps">
 <div class="step"><b>1</b><span>قرّب التلفون</span></div>
 <div class="step"><b>2</b><span>قيّم بنجوم</span></div>
 <div class="step"><b>3</b><span>خلصت ✨</span></div>
</div>
</body></html>
