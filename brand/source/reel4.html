<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="reel-base.css"><style>
#q1{top:360px;font-size:84px;line-height:1.3}
#phone{position:absolute;left:150px;width:780px;top:640px;height:900px;background:#0B1226;border:6px solid #22D3EE;border-radius:70px;padding:60px 36px;opacity:0}
#search{background:#1E293B;border-radius:44px;padding:26px 34px;font-size:44px;color:#CBD5E1;display:flex;gap:16px;align-items:center}
#search .cur{display:inline-block;width:3px;height:40px;background:#22D3EE;vertical-align:middle}
.res{margin-top:44px;border-radius:34px;padding:38px 40px;background:#13224A;border:3px solid transparent;opacity:0}
.res.win{border-color:#FBBF24;background:#1B2A55}
.res b{display:block;font-size:56px}
.res .st{font-size:46px;margin-top:8px;direction:rtl}
.res .st .n{font-family:Sora}
.res .gold{color:#FBBF24}
.res .dim{color:#64748B}
.res .tag{display:inline-block;margin-top:16px;background:#FBBF24;color:#0F172A;border-radius:22px;padding:6px 22px;font-size:34px;font-weight:700}
#q2{top:1660px;font-size:70px}
#big{top:720px;font-size:104px;line-height:1.3}
#note{top:1780px;font-size:26px;color:#64748B;text-align:center}
</style></head><body>
<div id="logo" class="abs"><img src="logo-white.svg" alt=""></div>
<div id="q1" class="abs t">لما حدا يدوّر على<br><span class="c">«مطعم قريب مني»</span>…</div>
<div id="phone">
  <div id="search">🔍 <span id="typed"></span><span class="cur" id="cur"></span></div>
  <div class="res win" id="ra"><b>مطعم أ</b><div class="st"><span class="gold">★★★★★</span> <span class="n">4.8</span> · <span class="n">320</span> تقييم</div><span class="tag">بيطلع أول 👆</span></div>
  <div class="res" id="rb"><b>مطعم ب</b><div class="st"><span class="gold">★★★★</span><span class="dim">★</span> <span class="n">4.2</span> · <span class="n">12</span> تقييم</div></div>
</div>
<div id="q2" class="abs t">وين بتروح إنت؟ 🤔</div>
<div id="big" class="abs t">تقييمات أكثر<br>= <span class="c">زباين جداد</span> 📈</div>
<div id="note" class="abs">* مثال توضيحي</div>
<div class="abs end">
  <img src="logo-white.svg" alt="">
  <div class="line">خلّي زباينك المبسوطين<br><span class="c">يحكوا عنك على Google ⭐</span></div>
  <div class="cta">ابعتلنا «ستاند» 📩</div>
  <div class="g">💯 ضمان استرجاع المال خلال شهر</div>
</div>
<script src="reel-lib.js"></script>
<script>
const Q="مطعم قريب مني";
window.renderAt=function(t){
  show($('q1'),t,0.2,6.0,.4,.3,40);
  const ph=$('phone'); const pi=easeOut(prog(t,0.8,1.3)); ph.style.opacity=Math.min(pi,1-prog(t,6.0,6.3));
  ph.style.transform=`translateY(${(1-pi)*120}px)`;
  const n=Math.floor(Q.length*prog(t,1.4,2.8)); $('typed').textContent=Q.slice(0,n);
  $('cur').style.opacity = (Math.floor(t*3)%2===0 || t<2.8)?1:0;
  show($('ra'),t,3.1,6.3,.35,.3,30); show($('rb'),t,3.5,6.3,.35,.3,30);
  show($('q2'),t,4.3,6.3,.35,.3,30);
  show($('note'),t,3.1,6.3,.3,.3,0);
  const bg=$('big'); const bk=prog(t,6.4,6.8); bg.style.opacity=Math.min(bk>0?1:0,1-prog(t,8.7,9.0));
  bg.style.transform=`scale(${bk>0?back(bk):.001})`;
  endCard(t,9.1);
};
renderAt(0);
</script></body></html>
